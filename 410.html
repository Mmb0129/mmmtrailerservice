<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Page Removed – MMM Trailer Service</title>
  <style>
    :root { --navy: #0D1B3E; --gold: #F5A800; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      line-height: 1.6;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2rem); margin-bottom: 16px; }
    p { color: #c0cfe0; margin-bottom: 28px; }
    a.btn {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 4px;
      min-height: 44px;
    }
    a.btn:hover { background: #F5C518; }
    a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>This page has been removed</h1>
    <p>It is no longer part of our website. If you were looking for transport, we are still here.</p>
    <a class="btn" href="/">Go to MMM Trailer Service</a>
  </main>
</body>
</html>
